<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark rounded background matching site theme -->
  <rect width="64" height="64" rx="14" fill="#0B0E14"/>

  <!-- Voxel accent marks (subtle grid motif tying to the 3D scene-completion task) -->
  <g fill="#6BA8FF" opacity="0.32">
    <rect x="8"  y="8"  width="5" height="5" rx="1"/>
    <rect x="15" y="8"  width="5" height="5" rx="1"/>
    <rect x="8"  y="15" width="5" height="5" rx="1"/>
  </g>
  <g fill="#F19340" opacity="0.32">
    <rect x="45" y="45" width="5" height="5" rx="1"/>
    <rect x="52" y="45" width="5" height="5" rx="1"/>
    <rect x="45" y="52" width="5" height="5" rx="1"/>
    <rect x="52" y="52" width="5" height="5" rx="1"/>
  </g>

  <!-- Monogram: italic serif G in the paper's accent orange -->
  <text x="32" y="48" text-anchor="middle"
        font-family="Georgia, 'Instrument Serif', serif"
        font-size="56" font-style="italic" font-weight="400"
        fill="#F19340">G</text>
</svg>
